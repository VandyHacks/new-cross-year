<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="1" seed="13" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer>
      <feFuncR type="linear" slope="5" intercept="-2.4" />
      <feFuncG type="linear" slope="5" intercept="-2.4" />
      <feFuncB type="linear" slope="5" intercept="-2.4" />
      <feFuncA type="table" tableValues="1 1" />
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#grain)" />
</svg>
